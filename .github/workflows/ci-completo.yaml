name: 🚀 CI/CD DevSecOps - Auth Service

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/auth/**'
      - '.github/workflows/ci-auth.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/auth/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: auth-service
  GITOPS_REPO: seu-usuario/togglemaster-gitops
  IMAGE_TAG: v1.0.0-${{ github.sha }}

jobs:
  # =========================================================================
  # JOB 1: Build, Test e Lint
  # =========================================================================
  build-and-test:
    name: 🧪 Build, Lint & Testes
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      # Se o seu auth-service for Go:
      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/auth/go.sum

      - name: 🔍 Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/auth

      - name: 🧪 Executar Testes Unitários
        working-directory: services/auth
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: 📊 Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-coverage
          path: services/auth/coverage.out
          retention-days: 7

  # =========================================================================
  # JOB 2: Segurança (SAST & SCA) com Regra de Bloqueio Crítico
  # =========================================================================
  security-sast-sca:
    name: 🛡️ Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      # SAST: Análise Estática de Vulnerabilidades no Código
      - name: 🔎 SAST (Gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -confidence high ./services/auth/...

      # SCA: Análise de Vulnerabilidades em Dependências (Trivy FS)
      - name: 📦 SCA - Scan de Dependências (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'services/auth'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1' # Bloqueia o pipeline se encontrar vulnerabilidade CRÍTICA

  # =========================================================================
  # JOB 3: Build da Imagem Docker, Container Scan & Push ECR
  # =========================================================================
  docker-build-push:
    name: 🐳 Docker Build, Scan & Push ECR
    runs-on: ubuntu-latest
    needs: security-sast-sca
    # Push no ECR e GitOps apenas quando for merge/push na main ou develop
    if: github.event_name == 'push'

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔑 Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Necessário para AWS Academy
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔓 Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏗️ Docker Build Local
        working-directory: services/auth
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      # Container Image Scan: Valida a imagem gerada antes de enviar ao repositório
      - name: 🛡️ Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1' # Bloqueia e impede o push se a imagem base tiver CVE Crítica

      - name: 🚀 Push da Imagem para o ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

  # =========================================================================
  # JOB 4: Atualização Automática no Repositório de GitOps (CD)
  # =========================================================================
  gitops-update:
    name: 🔄 GitOps Auto-Sync Tag
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: 📥 Checkout do Repositório GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }} # Personal Access Token com permissão de escrita no repo GitOps
          ref: main

      - name: 🔧 Configurar Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: 📝 Atualizar Tag da Imagem no Overlay de Dev
        run: |
          cd services/auth/overlays/dev
          kustomize edit set image auth-image-placeholder=*:${{ env.IMAGE_TAG }}

      - name: 📤 Commit e Push da Atualização
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add services/auth/overlays/dev/kustomization.yaml
          git commit -m "ci(auth): update image tag to ${{ env.IMAGE_TAG }} [skip ci]"
          git push origin main