name: 🚀 CI/CD DevSecOps - Auth Service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: togglemaster/auth-service
  GITOPS_REPO: igorcorrean/togglemaster-infrastructure
  IMAGE_TAG: v1.0.0-${{ github.sha }}

jobs:
  # =========================================================================
  # JOB 1: Build, Test e Lint
  # =========================================================================
  build-and-test:
    name: 🧪 Build, Lint & Testes
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      # Se o seu auth-service for Go:
      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 🔍 Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: 🧪 Executar Testes Unitários
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: 📊 Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-coverage
          path: coverage.out
          retention-days: 7

  # =========================================================================
  # JOB 2: Segurança (SAST & SCA) com Regra de Bloqueio Crítico
  # =========================================================================
  security-sast-sca:
    name: 🛡️ Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔎 SAST (Gosec)
        uses: securego/gosec@master
        with:
          args: '-severity high -confidence high ./...'

      # SCA: Análise de Vulnerabilidades em Dependências (Trivy FS)
      - name: 📦 SCA - Scan de Dependências (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1' # Bloqueia o pipeline se encontrar vulnerabilidade CRÍTICA

  # =========================================================================
  # JOB 3: Build da Imagem Docker, Container Scan & Push ECR
  # =========================================================================
  docker-build-push:
    name: 🐳 Docker Build, Scan & Push ECR
    runs-on: ubuntu-latest
    needs: security-sast-sca
    if: github.event_name == 'push'

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔑 Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Necessário caso use AWS Academy
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔓 Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 1º Passo: Construir a imagem localmente com a tag do commit
      - name: 🏗️ Docker Build Local
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

      # 2º Passo: Scan da imagem já construída no Docker daemon local
      - name: 🛡️ Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1' # Bloqueia e impede os passos seguintes se houver CVE Crítica

      # 3º Passo: Push para o ECR (só executa se o Trivy aprovar)
      - name: 🚀 Push da Imagem para o ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
