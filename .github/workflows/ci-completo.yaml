name: 🚀 CI/CD DevSecOps - Auth Service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: auth-service
  GITOPS_REPO: igorcorrean/togglemaster-gitops
  IMAGE_TAG: v1.0.0-${{ github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  # =========================================================================
  # JOB 1: Build, Test e Lint
  # =========================================================================
  build-and-test:
    name: 🧪 Build, Lint & Testes
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 🔍 Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: 🧪 Executar Testes Unitários
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: 📊 Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-coverage
          path: coverage.out
          retention-days: 7

  # =========================================================================
  # JOB 2: Segurança (SAST & SCA) com Regra de Bloqueio Crítico
  # =========================================================================
  security-sast-sca:
    name: 🛡️ Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      # SAST: Varredura de vulnerabilidades no código Go com bloqueio
      - name: 🔎 SAST (Gosec)
        uses: securego/gosec@master
        with:
          args: '-severity high -confidence high ./...'

      # SCA: Análise de vulnerabilidades nas dependências Go
      - name: 📦 SCA - Scan de Dependências (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1' # Bloqueia o pipeline se encontrar vulnerabilidade CRÍTICA

  # =========================================================================
  # JOB 3: Build da Imagem Docker, Container Scan & Push ECR
  # =========================================================================
  docker-build-push:
    name: 🐳 Docker Build, Scan & Push ECR
    runs-on: ubuntu-latest
    needs: security-sast-sca
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔑 Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🔓 Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 1º Passo: Construir a imagem localmente
      - name: 🏗️ Docker Build Local
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

      # 2º Passo: Scan da imagem localmente antes do push
      - name: 🛡️ Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

      # 3º Passo: Push para o ECR (após aprovação do scan)
      - name: 🚀 Push da Imagem para o ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
# =========================================================================
  # JOB 4: Atualização Automática no Repositório de GitOps (CD)
  # =========================================================================
  gitops-update:
    name: 🔄 GitOps Auto-Sync Tag
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout do Repositório GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          ref: main

      - name: 🔧 Configurar Kustomize
        uses: imranismail/setup-kustomize@v2

      # 1. Ajuste do caminho correto conforme a árvore do repositório
      # 2. Atualização precisa da tag no kustomization.yaml
      - name: 📝 Atualizar Tag da Imagem
        run: |
          cd apps/overlays/production
          
          # Atualiza a tag da imagem auth-service
          kustomize edit set image auth-service=271384503138.dkr.ecr.us-east-1.amazonaws.com/auth-service:${{ env.IMAGE_TAG }}
          
          echo "Manifesto kustomization.yaml atualizado:"
          cat kustomization.yaml

      - name: 📤 Commit e Push da Atualização
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add apps/overlays/production/kustomization.yaml
          
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada para commit"
          else
            git commit -m "ci(auth): update image tag to ${{ env.IMAGE_TAG }} [skip ci]"
            git push origin main
          fi